services:
  - type: web
    name: squadly-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4-fast
      - key: https://vercel.com/vanztarrs-projects/crewfit-app
        sync: false
